  <!-- HTML5 — official #E34F26 -->
<symbol id="icon-html5" viewBox="0 0 512 512">
  <clipPath id="html5-left-half"><rect x="0" y="0" width="256" height="512"/></clipPath>
  <path d="M32 0 L480 0 L435 400 L256 472 L77 400 Z" fill="#F16529"/>
  <path d="M32 0 L480 0 L435 400 L256 472 L77 400 Z" fill="#E34F26" clip-path="url(#html5-left-half)"/>
  <text x="256" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="230" font-weight="700" fill="#EBEBEB">5</text>
  <g clip-path="url(#html5-left-half)">
    <text x="256" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="230" font-weight="700" fill="#FFFFFF">5</text>
  </g>
</symbol>

<!-- CSS3 official shield badge, viewBox 0 0 512 512 -->
<symbol id="icon-css3" viewBox="0 0 512 512">
  <clipPath id="css3-left-half"><rect x="0" y="0" width="256" height="512"/></clipPath>
  <path d="M32 0 L480 0 L435 400 L256 472 L77 400 Z" fill="#1572B6"/>
  <path d="M32 0 L480 0 L435 400 L256 472 L77 400 Z" fill="#33A9DC" clip-path="url(#css3-left-half)"/>
  <text x="256" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="230" font-weight="700" fill="#EBEBEB">3</text>
  <g clip-path="url(#css3-left-half)">
    <text x="256" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="230" font-weight="700" fill="#FFFFFF">3</text>
  </g>
</symbol>

  <!-- JavaScript — official #F7DF1E -->
  <symbol id="icon-javascript" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="5" fill="#F7DF1E"/>
    <text x="12" y="16.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#000">JS</text>
  </symbol>

  <!-- React — official atom mark #61DAFB on dark #20232A -->
  <symbol id="icon-react" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="5" fill="#20232A"/>
    <g stroke="#61DAFB" stroke-width="1" fill="none">
      <ellipse cx="12" cy="12" rx="7.5" ry="3" />
      <ellipse cx="12" cy="12" rx="7.5" ry="3" transform="rotate(60 12 12)"/>
      <ellipse cx="12" cy="12" rx="7.5" ry="3" transform="rotate(120 12 12)"/>
    </g>
    <circle cx="12" cy="12" r="1.6" fill="#61DAFB"/>
  </symbol>

  <!-- DOM Manipulation — no official brand, using site accent (sky) -->
  <symbol id="icon-dom" viewBox="0 0 24 24">
    <path fill="none" stroke="#5fa8d3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
      d="M7.5 4.5 3 12l4.5 7.5M16.5 4.5 21 12l-4.5 7.5M14 5l-4 14"/>
  </symbol>

  <!-- REST API — no official brand, using site accent (amber) -->
  <symbol id="icon-restapi" viewBox="0 0 24 24">
    <path fill="none" stroke="#e8a33d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
      d="M4 8h13M17 8l-3-3M17 8l-3 3M20 16H7M7 16l3-3M7 16l3 3"/>
  </symbol>

  <!-- CSS Animation — no official brand, using site accent (sky) -->
  <symbol id="icon-cssanim" viewBox="0 0 24 24">
    <circle cx="6" cy="12" r="2.2" fill="#5fa8d3"/>
    <circle cx="12" cy="12" r="2.2" fill="#5fa8d3" opacity="0.6"/>
    <circle cx="18" cy="12" r="2.2" fill="#5fa8d3" opacity="0.3"/>
  </symbol>

<!-- LIVE URL / EXTERNAL LINK icon -->
<symbol id="icon-live-url" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
  <polyline points="15 3 21 3 21 9" />
  <line x1="10" y1="14" x2="21" y2="3" />
</symbol>

</svg>
